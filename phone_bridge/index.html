<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>폰 화면 원격 제어 대시보드</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #111; color: #eee; margin: 0; padding: 24px; }
  h1 { font-size: 18px; color: #9ad; }
  .wrap { display: flex; gap: 24px; align-items: flex-start; }
  #screen { border: 2px solid #444; cursor: crosshair; max-width: 420px; display: block; }
  #log { font-family: monospace; font-size: 12px; background: #000; padding: 12px; width: 360px;
         height: 480px; overflow-y: auto; border: 1px solid #333; }
  .dot { position: absolute; width: 14px; height: 14px; border: 2px solid #f44; border-radius: 50%;
         transform: translate(-50%, -50%); pointer-events: none; }
  #screenWrap { position: relative; display: inline-block; }
</style>
</head>
<body>
  <h1>📱 폰 화면 원격 제어 — 클릭하면 실제 폰이 탭됩니다</h1>
  <div class="wrap">
    <div id="screenWrap">
      <img id="screen" src="/stream">
    </div>
    <div id="log"></div>
  </div>

<script>
const img = document.getElementById('screen');
const wrap = document.getElementById('screenWrap');
const log = document.getElementById('log');
let screenSize = { width: 1170, height: 2532 };

fetch('/screen_size').then(r => r.json()).then(s => { screenSize = s; });

function addLog(msg) {
  const line = document.createElement('div');
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  log.prepend(line);
}

img.addEventListener('click', async (e) => {
  const rect = img.getBoundingClientRect();
  const relX = (e.clientX - rect.left) / rect.width;
  const relY = (e.clientY - rect.top) / rect.height;
  const phoneX = Math.round(relX * screenSize.width);
  const phoneY = Math.round(relY * screenSize.height);

  // 클릭 위치에 빨간 점 잠깐 표시
  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.style.left = (e.clientX - rect.left) + 'px';
  dot.style.top = (e.clientY - rect.top) + 'px';
  wrap.appendChild(dot);
  setTimeout(() => dot.remove(), 500);

  addLog(`클릭 → 폰 좌표 (${phoneX}, ${phoneY}) 전송 중...`);
  try {
    const res = await fetch('/tap', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ x: phoneX, y: phoneY }),
    });
    const data = await res.json();
    addLog(data.ok ? `✅ 탭 성공 (${phoneX}, ${phoneY})` : `❌ 실패: ${data.error}`);
  } catch (err) {
    addLog(`❌ 요청 실패: ${err}`);
  }
});
</script>
</body>
</html>
