<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>드론 화면 원격 제어 대시보드</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #111; color: #eee; margin: 0; padding: 24px; }
  h1 { font-size: 18px; color: #9ad; margin: 0 0 16px; }
  .wrap { display: flex; gap: 24px; align-items: flex-start; }
  .main { display: inline-block; position: relative; }
  #drone { border: 2px solid #444; cursor: crosshair; width: 820px; max-width: 70vw; display: block; background: #000; }
  .side { display: flex; flex-direction: column; gap: 12px; width: 320px; }
  #phoneFull { border: 1px solid #333; width: 100%; opacity: 0.85; }
  #log { font-family: monospace; font-size: 12px; background: #000; padding: 12px; width: 100%;
         height: 420px; overflow-y: auto; border: 1px solid #333; box-sizing: border-box; }
  .dot { position: absolute; width: 16px; height: 16px; border: 3px solid #f44; border-radius: 50%;
         transform: translate(-50%, -50%); pointer-events: none; }
  .label { font-size: 12px; color: #888; margin-bottom: 4px; }
</style>
</head>
<body>
  <h1>🚁 드론 화면 원격 제어 — 크게 보이는 쪽을 클릭하면 폰이 실제로 탭됩니다</h1>
  <div class="wrap">
    <div class="main" id="droneWrap">
      <img id="drone" src="/drone_view">
    </div>
    <div class="side">
      <div>
        <div class="label">폰 전체 화면 (디버그·좌표 보정용)</div>
        <img id="phoneFull" src="/stream">
      </div>
      <div id="log"></div>
    </div>
  </div>

<script>
const drone = document.getElementById('drone');
const droneWrap = document.getElementById('droneWrap');
const log = document.getElementById('log');

function addLog(msg) {
  const line = document.createElement('div');
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  log.prepend(line);
}

drone.addEventListener('click', async (e) => {
  const rect = drone.getBoundingClientRect();
  const relX = (e.clientX - rect.left) / rect.width;
  const relY = (e.clientY - rect.top) / rect.height;

  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.style.left = (e.clientX - rect.left) + 'px';
  dot.style.top = (e.clientY - rect.top) + 'px';
  droneWrap.appendChild(dot);
  setTimeout(() => dot.remove(), 500);

  addLog(`드론뷰 클릭 (${relX.toFixed(3)}, ${relY.toFixed(3)}) → 탭 전송 중...`);
  try {
    const res = await fetch('/drone_tap', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rel_x: relX, rel_y: relY }),
    });
    const data = await res.json();
    addLog(data.ok ? `✅ 탭 성공 (맥 좌표 ${data.x}, ${data.y})` : `❌ 실패: ${data.error}`);
  } catch (err) {
    addLog(`❌ 요청 실패: ${err}`);
  }
});
</script>
</body>
</html>
